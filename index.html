<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copa Botânica · Marista Asa Sul 2026</title>
<meta name="description" content="Duelos de botânica: evolua de musgo a árvore centenária respondendo perguntas.">
<meta property="og:title" content="Copa Botânica · Marista Asa Sul 2026 🌳">
<meta property="og:description" content="Duelos de botânica ao vivo. Vença e evolua: musgo → samambaia → pinheiro → flor → fruto.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="theme-color" content="#0c2617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copa Botânica">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="polen-ar" id="polen"></div>
<div class="app" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="comum.js"></script>
<script>
const qs = new URLSearchParams(location.search);
let SALA = (qs.get('sala') || '').toUpperCase().trim();
const chave = () => 'tb_' + SALA;
let EU = null;              // {token, id, nome}
let ESTADO = null, VERSAO = -1;
const MINHAS = {};          // ref -> opção escolhida
let ultimoHtml = '', ultimaTela = '', avisoTemp = '';
const app = document.getElementById('app');

function ultimaSala() { try { return localStorage.getItem('tb_ultima_sala') || ''; } catch (e) { return ''; } }
document.addEventListener('instalavel', () => { if (!SALA) telaCodigo(); else if (EU && ESTADO) { ultimoHtml = ''; desenhar(); } });
function lerEu() { try { return JSON.parse(localStorage.getItem(chave()) || 'null'); } catch (e) { return null; } }
function salvarEu(v) { try { v ? localStorage.setItem(chave(), JSON.stringify(v)) : localStorage.removeItem(chave()); } catch (e) {} }


// ---------- entrada ----------
function telaCodigo(msg) {
  app.innerHTML = `${MARCA}
  <div class="cartao centro surge">
    <div class="avatar">🌱</div>
    <h2 style="margin:8px 0 4px">Qual é o código da sala?</h2>
    <p class="suave">Está no telão, embaixo do QR code.</p>
    <input class="campo centro" id="cod" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" value="${esc(ultimaSala())}" style="font-size:2rem;letter-spacing:8px;text-transform:uppercase">
    <p class="erro-msg">${esc(msg || '')}</p>
    <button class="btn" id="ir">Continuar</button>
  </div>${botaoInstalar()}`;
  const ir = () => { const c = document.getElementById('cod').value.toUpperCase().trim(); if (c.length === 4) location.search = '?sala=' + c; };
  document.getElementById('ir').onclick = ir;
  document.getElementById('cod').onkeydown = (e) => { if (e.key === 'Enter') ir(); };
}

function telaNome(msg) {
  const andamento = ESTADO && ESTADO.fase && ESTADO.fase !== 'lobby';
  app.innerHTML = `<div class="logo-grande surge">${LOGO}<h1>Copa Botânica</h1><small>Marista Asa Sul · 2026</small></div>
  <div class="cartao centro surge">
    <div class="trilha">🌱<i>›</i>🌿<i>›</i>🌲<i>›</i>🌸<i>›</i>🍎</div>
    <h1 style="margin:10px 0 6px;font-size:1.7rem">Entra na arena 🌿</h1>
    <p class="suave" style="margin:0 0 14px">Vença duelos de botânica e evolua de <b>musgo</b> até <b>planta com fruto</b>. Quem perde vira torcida e ainda pode voltar na <b>repescagem</b>.</p>
    ${andamento ? `<p class="fogo" style="color:#b25d00">A Copa já começou: você entra como torcida 📣</p>` : ''}
    <input class="campo" id="nome" maxlength="60" autocomplete="name" placeholder="Seu nome completo">
    <p class="erro-msg" id="erro">${esc(msg || '')}</p>
    <button class="btn" id="entrar">Entrar 🌱</button>
    <p class="suave pequeno" style="margin:12px 0 0">Sala <b>${esc(SALA)}</b> · use o nome que está na chamada · <a href="manual#regras">como funciona?</a></p>
  </div>`;
  const campo = document.getElementById('nome'), bt = document.getElementById('entrar');
  const enviar = async () => {
    const nome = campo.value.replace(/\s+/g, ' ').trim();
    if (nome.split(' ').length < 2) { document.getElementById('erro').textContent = 'Coloque nome e sobrenome 🙂'; return; }
    bt.disabled = true; bt.textContent = 'Entrando…';
    try {
      const r = await rpc('entrar', { p_codigo: SALA, p_nome: nome });
      EU = { token: r.token, id: String(r.id), nome: r.nome }; salvarEu(EU);
      try { localStorage.setItem('tb_ultima_sala', SALA); } catch (e) {}
      som('entrou'); vibrar(40); iniciar();
    } catch (e) { document.getElementById('erro').textContent = e.message; bt.disabled = false; bt.textContent = 'Entrar 🌱'; }
  };
  bt.onclick = enviar; campo.onkeydown = (e) => { if (e.key === 'Enter') enviar(); };
  setTimeout(() => campo.focus(), 300);
}

// ---------- sincronização ----------
let iniciado = false;
function iniciar() {
  if (iniciado) { consultar(); return; }
  iniciado = true;
  assinarSala(SALA, (linha) => receber(linha.estado, linha.versao));
  consultar();
  setInterval(consultar, 4000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && consultar());
}
async function consultar() {
  const t0 = Date.now();
  try {
    const d = await rpc('ver_jogo', { p_codigo: SALA, p_token: EU ? EU.token : null });
    ajustarRelogio(d.agora, t0);
    if (EU && !d.eu) { salvarEu(null); EU = null; ESTADO = d.estado; telaNome('Sua entrada expirou, entre de novo.'); return; }
    if (d.eu && d.eu.removido) { app.innerHTML = `${MARCA}<div class="cartao centro"><h2>Você foi removido da sala pelo professor.</h2><p class="suave">Se foi engano, fale com o professor e entre de novo com seu nome completo.</p><button class="btn" onclick="localStorage.removeItem('${chave()}');location.reload()">Entrar de novo</button></div>`; return; }
    if (d.minha_resposta !== null && d.minha_resposta !== undefined && d.estado.ref) MINHAS[d.estado.ref] = d.minha_resposta;
    receber(d.estado, d.versao);
  } catch (e) { /* rede instável: tenta de novo no próximo ciclo */ }
}
function receber(estado, versao) {
  if (versao !== undefined && versao < VERSAO) return;
  if (versao !== undefined) VERSAO = versao;
  ESTADO = estado || {};
  desenhar();
}

// ---------- telas do jogo ----------
function minhaQ() { const a = ESTADO.atrib, qid = a && a[EU.id]; return qid && ESTADO.qs ? ESTADO.qs[qid] : null; }
function meuDuelo() { return (ESTADO.duelos || []).find((d) => d.a === EU.id || d.b === EU.id); }
function oponente(d) { if (!d || !d.b) return null; const id = d.a === EU.id ? d.b : d.a; return { id, ...(ESTADO.j[id] || { n: '?' }) }; }
function meuPlacar(d) { return d.a === EU.id ? [d.pa, d.pb] : [d.pb, d.pa]; }

function trilha(n) {
  return `<div class="trilha">${ESTAGIOS.slice(0, 5).map((s, i) => `<span class="${i > n ? 'apagado' : ''}">${s.e}</span>`).join('<i>›</i>')}</div>`;
}

// posição na torcida e quanto falta para alcançar o 1º (quem lidera volta na repescagem)
function situacaoTorcida() {
  const eu = ESTADO.j[EU.id]; if (!eu || eu.v || !eu.el) return null;
  const t = ranking(ESTADO).filter((p) => !p.v && p.el), pos = t.findIndex((p) => p.id === EU.id) + 1;
  return { pos, falta: pos > 1 ? t[0].p - eu.p + 1 : 0, total: t.length };
}
function miniDuelo(d) {
  if (!d) {
    const st = situacaoTorcida(), eu = ESTADO.j[EU.id] || {};
    const meta = !st ? '' : st.pos === 1 ? '🥇 1º da torcida: você é o próximo a rebrotar!' : `${st.pos}º da torcida · faltam <b>${st.falta} 🌼</b> para o 1º lugar`;
    return `<div class="mini-duelo"><span>🌻 Torcida</span><span class="pl">${eu.p || 0} 🌼</span></div>${meta ? `<p class="tensao">${meta}</p>` : ''}`;
  }
  if (!d.b) return `<div class="mini-duelo"><span>🌰 Passe livre nesta rodada</span></div>`;
  const op = oponente(d), [m, o] = meuPlacar(d);
  return `<div class="mini-duelo"><span>Você</span><span class="pl">${m} × ${o}</span><span style="text-align:right">${esc(curto(op.n))} ${estagio(op.e).e}</span></div>${tensao(d, m, o)}`;
}
// mostra o que está em jogo NESTA pergunta (efeito de meta próxima e de aversão à perda)
function tensao(d, m, o) {
  const e = ESTADO;
  if (d.w || !['preparar', 'pergunta'].includes(e.fase)) return '';
  if (e.morte_subita) return '<p class="tensao quente">⚡ Morte súbita: acertou primeiro, levou!</p>';
  const resta = e.k - e.q_num - 1;          // perguntas que sobram depois desta
  if (m + 1 - o > resta) return '<p class="tensao quente">🏆 Acerte esta e o duelo é seu!</p>';
  if (o + 1 - m > resta) return '<p class="tensao perigo">🛡️ Pergunta decisiva: não pode errar!</p>';
  if (m === o) return '<p class="tensao">🤝 Empatados: quem acertar sai na frente</p>';
  return '';
}

function desenhar() {
  if (!EU) { telaNome(); return; }
  const e = ESTADO, eu = (e.j || {})[EU.id];
  const fase = e.fase || 'lobby';
  let html = '';
  const telaChave = `${fase}|${e.ref || ''}|${e.rodada || 0}`;
  const mudouTela = telaChave !== ultimaTela;

  if (fase === 'lobby' || !eu) {
    const ids = Object.keys(e.j || {});
    const ultimos = ids.slice(-10).reverse().map((id) => e.j[id]).filter(Boolean);
    html = `${MARCA}
    <div class="cartao centro surge">
      <div class="avatar grande pulsa">🌱</div>
      <h2 style="margin-top:8px">Tá dentro, ${esc(primeiroNome(EU.nome))}! 🌿</h2>
      <p class="suave">Fica de olho no telão: quando a sala fechar, sai o seu adversário.</p>
      ${trilha(0)}
      <p class="suave pequeno">Cada vitória = uma novidade evolutiva. Chegue à planta com fruto!</p>
    </div>
    <div class="centro"><h3 class="claro">${ids.length || 1} botânico${ids.length === 1 ? '' : 's'} na sala</h3></div>
    <div class="chips">${ultimos.map((p) => `<span class="chip">🌱 ${esc(curto(p.n))}</span>`).join('')}</div>
    <button class="btn sec" data-acao="convidar">🌱 Chamar a galera</button>
    ${botaoInstalar()}
    <div class="cartao"><b>🪴 Curiosidade</b><p style="margin:6px 0 0" id="fato">${esc(FATOS[Math.floor(Date.now() / 8000) % FATOS.length])}</p></div>`;
  } else if (fase === 'chave') {
    const d = meuDuelo(), op = oponente(d);
    const rebrotei = e.evento && e.evento.tipo === 'repescagem' && e.evento.id === EU.id;
    if (!d) html = telaTorcida('Rodada ' + e.rodada + ' vai começar');
    else if (!d.b) html = `${MARCA}<div class="cartao centro surge"><div class="avatar grande">🌰</div><h2>Semente dormente: passe livre!</h2><p class="suave">Número ímpar de jogadores: nesta rodada você avança direto. Responda mesmo assim para somar pólen 🌼.</p></div>`;
    else html = `${MARCA}
      ${rebrotei ? `<div class="cartao centro surge"><div class="avatar">🌱🌧️</div><h2>VOCÊ REBROTOU!</h2><p class="suave">Foi o melhor da torcida em pólen e voltou para a Copa pela repescagem.</p></div>` : ''}
      <div class="centro"><span class="tema">Rodada ${e.rodada}${e.k === 5 ? ' · GRANDE FINAL' : ''}</span></div>
      <div class="cartao surge">
        <div class="duelo">
          <div class="lado"><div class="avatar">${estagio(eu.e).e}</div><div class="nome">${esc(primeiroNome(eu.n))}</div><div class="suave pequeno">${estagio(eu.e).nome}</div></div>
          <div class="vs">VS</div>
          <div class="lado"><div class="avatar">${estagio(op.e).e}</div><div class="nome">${esc(primeiroNome(op.n))}</div><div class="suave pequeno">${esc(curto(op.n))}</div></div>
        </div>
      </div>
      <p class="centro claro">Melhor de ${e.k} perguntas, e cada dupla recebe a sua. Empatou? <b>Morte súbita</b> ⚡</p>
      <p class="centro suave pequeno" style="color:#ffffff99">Responder certo e rápido também vale pólen 🌼 para o ranking geral.</p>`;
  } else if (fase === 'preparar') {
    html = `${MARCA}${miniDuelo(meuDuelo())}
      <div class="cartao centro surge" style="padding:36px 18px">
        <h2>${e.morte_subita ? '⚡ MORTE SÚBITA' : `Pergunta ${e.q_num + 1} de ${e.k}`}</h2>
        ${e.morte_subita ? `<p class="suave">${meuDuelo() && meuDuelo().b && !meuDuelo().w ? 'Quem acertar (e mais rápido) leva o duelo!' : 'Só os duelos empatados valem; você joga por pólen 🌼'}</p>` : ''}
        <div class="contagem" data-fim="${ms(e.prep_fim)}">3</div>
        <p class="suave">Foco total 🌱</p>
      </div>`;
  } else if (fase === 'pergunta') {
    const q = minhaQ(), minha = MINHAS[e.ref];
    const d = meuDuelo(), op = oponente(d);
    const opRespondeu = op && (e.respondidos || []).includes(op.id);
    const valeDuelo = d && d.b && !d.w;
    if (!q) html = `${MARCA}<div class="cartao centro surge"><div class="avatar">🌱</div><h2>Você chegou no meio de uma pergunta</h2><p class="suave">Na próxima você já recebe a sua. Fica de olho!</p></div>`;
    else html = `${MARCA}${miniDuelo(d)}
      <div class="barra-tempo" data-ini="${ms(e.q_inicio)}" data-fim="${ms(e.q_fim)}"></div>
      <div class="cartao"><span class="tema">${esc(q.tema)}</span>${e.morte_subita ? ' <span class="tema" style="background:var(--sol);color:#3a2a00">⚡ morte súbita</span>' : ''}
        <div class="enunciado">${esc(q.texto)}</div></div>
      <div class="opcoes">${q.opcoes.map((t, i) => `<button class="op op${i} ${minha !== undefined ? (minha === i ? 'escolhida' : 'apagada') : ''}" data-op="${i}" ${minha !== undefined ? 'disabled' : ''}><span class="letra">${LETRAS[i]}</span><span>${esc(t)}</span></button>`).join('')}</div>
      <p class="centro claro">${minha !== undefined ? '🌱 Resposta plantada! Espera o tempo acabar…' : ''}
        ${valeDuelo && opRespondeu && minha === undefined ? `🍃 <b>${esc(primeiroNome(op.n))} já respondeu!</b>` : ''}
        ${d && d.w && d.b ? 'Seu duelo já está decidido: agora vale pólen 🌼' : ''}
        ${!valeDuelo && !(d && d.w && d.b) ? 'Valendo pólen 🌼 para o ranking e a repescagem' : ''}</p>
      ${avisoTemp ? `<p class="centro erro-msg">${esc(avisoTemp)}</p>` : ''}`;
  } else if (fase === 'revelacao') {
    const q = minhaQ(), rv = (e.revelacao || {})[e.atrib && e.atrib[EU.id]], minha = MINHAS[e.ref];
    const d = meuDuelo();
    if (!q || !rv) html = `${MARCA}${miniDuelo(d)}<div class="cartao centro surge"><div class="avatar">🪴</div><h2>Hora da explicação</h2><p class="suave">Olhe para o telão: o professor está comentando as respostas.</p></div>`;
    else {
      const certo = minha === rv.correta;
      const titulo = minha === undefined ? '<span class="ruim">🍂 O tempo secou</span>' : certo ? `<span class="bom">🌿 Mandou bem! +${eu.g || 0} 🌼</span>` : '<span class="ruim">🥀 Murchou… errou</span>';
      if (mudouTela) { if (certo) { som('certo'); vibrar(60); } else { som('errado'); vibrar([80, 60, 80]); } }
      html = `${MARCA}${miniDuelo(d)}
        <div class="cartao centro surge"><div class="resultado">${titulo}</div>
          ${eu.ms != null && minha !== undefined ? `<p class="suave" style="margin:6px 0 0">⚡ respondeu em <b>${(eu.ms / 1000).toFixed(1).replace('.', ',')} s</b></p>` : ''}
          ${eu.s >= 2 ? `<div class="fogo" style="margin-top:8px">🔥 ${eu.s} seguidas${eu.s >= 3 ? ' · pegando fogo!' : ''}</div>` : ''}
          ${(() => { const op = oponente(d); if (!op || !d || !d.b) return '';
            const nm = esc(primeiroNome(op.n));
            const txt = op.ok === 1 ? (certo ? `🍃 ${nm} também acertou` : `🌿 ${nm} acertou`) : op.ok === 0 ? `🥀 ${nm} errou` : `🍂 ${nm} não respondeu`;
            return `<p class="suave" style="margin:6px 0 0">${txt}</p>`; })()}</div>
        <div class="cartao">
          <span class="tema">${esc(q.tema)}</span>
          <div class="enunciado pequeno" style="font-size:.95rem">${esc(q.texto)}</div>
          ${minha !== undefined && !certo ? `<p class="suave pequeno" style="margin:12px 0 6px">Você marcou:</p>
          <div class="op op${minha} apagada" style="box-shadow:none;opacity:.6"><span class="letra">${LETRAS[minha]}</span><span>${esc(q.opcoes[minha])}</span></div>` : ''}
          <p class="suave pequeno" style="margin:12px 0 6px">Resposta certa:</p>
          <div class="op op${rv.correta} certa" style="box-shadow:none"><span class="letra">${LETRAS[rv.correta]}</span><span>${esc(q.opcoes[rv.correta])}</span></div>
          ${rv.explicacao ? `<div class="explica" style="margin-top:12px"><b>Por quê?</b> ${esc(rv.explicacao)}</div>` : ''}
          <p class="suave pequeno centro" style="margin:10px 0 0">${rv.quem ? Math.round(100 * rv.acertos / rv.quem) : 0}% de quem recebeu esta pergunta acertou</p>
        </div>
        <p class="centro claro pequeno">🪴 O professor está comentando no telão. A próxima pergunta começa quando ele liberar.</p>`;
    }
  } else if (fase === 'fim_rodada') {
    const d = meuDuelo();
    if (d && d.w === EU.id) {
      const s = estagio(eu.e);
      if (mudouTela) { som('fanfarra'); vibrar([60, 40, 60, 40, 120]); setTimeout(() => confete(2.5), 200); }
      html = `${MARCA}<div class="cartao centro surge">
        <p class="suave" style="margin:0">Você venceu ${d.b ? 'o duelo' : '(passe livre)'} e EVOLUIU!</p>
        <div class="avatar grande pulsa" style="margin:10px 0">${s.e}</div>
        <h2>${s.nome}</h2><p style="font-weight:800">${s.ganho}</p>${trilha(eu.e)}</div>
        <p class="centro claro">Próxima rodada já já. Restam <b>${Object.values(ESTADO.j).filter((p) => p.v).length}</b> na disputa.</p>`;
    } else html = telaTorcida(d ? 'Você perdeu este duelo…' : 'Fim da rodada', !!d);
  } else if (fase === 'campeao') {
    const rk = ranking(e), pos = rk.findIndex((p) => p.id === EU.id) + 1, camp = e.j[e.campeao] || {};
    const souEu = e.campeao === EU.id;
    if (mudouTela) { if (souEu) { som('fanfarra'); confete(8); vibrar([100, 50, 100, 50, 300]); } else confete(3); }
    const s = estagio(eu.e);
    html = `${MARCA}
      <div class="cartao centro surge">
        ${souEu ? `<div class="avatar grande pulsa">🏆</div><h1>🌻 VOCÊ É O CAMPEÃO BOTÂNICO!</h1>` : `<p class="suave" style="margin:0">Campeão botânico</p><div class="avatar">🏆</div><h2>${esc(camp.n)}</h2>`}
      </div>
      <div class="cartao centro">
        <p class="suave" style="margin:0">Sua jornada</p>
        <div class="avatar" style="margin:8px 0">${s.e}</div>
        <h2>Chegou a ${s.nome}</h2>
        <p><b>${eu.p} 🌼 pólen</b> · ${eu.a} acerto${eu.a === 1 ? '' : 's'} · <b>${pos}º</b> de ${rk.length} no ranking</p>
        ${conquistas(eu, rk, pos)}
        <button class="btn" data-acao="resultado">🌸 Postar meu resultado</button>
      </div>
      <div class="cartao"><h3 style="margin-bottom:8px">🌼 Top 5 em pólen</h3><ol class="lista-rank">${rk.slice(0, 5).map((p, i) => `<li class="${p.id === EU.id ? 'eu' : ''}" style="background:#0f2e1d0d"><span class="pos">${i + 1}º</span><span>${estagio(p.e).e} ${esc(curto(p.n))}</span><span class="pts" style="color:#2f7a4a">${p.p}</span></li>`).join('')}</ol></div>`;
  }
  html += `<div class="rodape">Sala ${esc(SALA)} · ${esc(EU.nome)}</div>`;
  if (mudouTela) ultimaTela = telaChave;
  if (html !== ultimoHtml) { app.innerHTML = html; ultimoHtml = html; if (mudouTela) window.scrollTo(0, 0); }
}

function conquistas(eu, rk, pos) {
  const c = [];
  const prec = eu.nr ? Math.round(100 * eu.a / eu.nr) : 0;
  if (ESTADO.campeao === EU.id) c.push(['🏆', 'Campeão botânico']);
  if (pos > 0 && pos <= 3) c.push(['🌼', `Top 3 em pólen`]);
  if ((eu.sm || 0) >= 3) c.push(['🔥', `${eu.sm} acertos seguidos`]);
  if (eu.mm && eu.mm < 1e9) { const maisRapido = rk.every((p) => !p.mm || p.mm >= eu.mm); c.push(['⚡', maisRapido ? 'Resposta mais rápida da Copa' : `Acerto em ${(eu.mm / 1000).toFixed(1).replace('.', ',')} s`]); }
  if (eu.nr >= 3 && prec >= 75) c.push(['🎯', `${prec}% de precisão`]);
  if (eu.r) c.push(['🌧️', 'Rebrotou na repescagem']);
  if ((eu.e || 0) >= 2) c.push([estagio(eu.e).e, `Evoluiu até ${estagio(eu.e).nome}`]);
  if (!c.length) c.push(['🌱', 'Plantou a primeira semente']);
  return `<div class="conquistas">${c.slice(0, 4).map(([i, t]) => `<span class="conq"><b>${i}</b>${esc(t)}</span>`).join('')}</div>`;
}
function telaTorcida(titulo, acabeiDePerder) {
  const e = ESTADO, eu = e.j[EU.id];
  const torcida = ranking(e).filter((p) => !p.v && p.el);
  const pos = torcida.findIndex((p) => p.id === EU.id) + 1;
  return `${MARCA}<div class="cartao centro surge">
    <div class="avatar">🌻</div><h2>${esc(titulo)}</h2>
    <p>${acabeiDePerder ? 'Mas ainda não acabou! ' : ''}Você está na <b>torcida</b>: continue respondendo para ganhar pólen 🌼.</p>
    ${eu.el ? `<p class="suave">Se o número de classificados ficar ímpar, <b>o melhor da torcida em pólen volta</b> pela repescagem.</p>
      ${pos === 1 ? '<p class="fogo">🥇 Você lidera a torcida: é o próximo a rebrotar!</p>' : pos ? `<p class="fogo">${pos}º da torcida · faltam ${torcida[0].p - eu.p + 1} 🌼 para o 1º</p>` : ''}` : '<p class="suave">Você entrou com o torneio em andamento: está jogando pelo ranking de pólen.</p>'}
    <p style="font-weight:800">${eu.p} 🌼 · ${estagio(eu.e).e} ${estagio(eu.e).nome}</p></div>`;
}

// ---------- ações ----------
document.addEventListener('click', async (ev) => {
  const op = ev.target.closest('[data-op]');
  if (op && ESTADO && ESTADO.fase === 'pergunta') {
    const ref = ESTADO.ref, i = +op.dataset.op;
    if (MINHAS[ref] !== undefined) return;
    MINHAS[ref] = i; vibrar(30); avisoTemp = ''; desenhar();
    try { await rpc('responder', { p_token: EU.token, p_ref: ref, p_opcao: i }); }
    catch (e) { if (!/esgotado/i.test(e.message)) delete MINHAS[ref]; avisoTemp = e.message; desenhar(); }
    return;
  }
  const ac = ev.target.closest('[data-acao]');
  if (!ac) return;
  const link = `${location.origin}/?sala=${SALA}`;
  let texto = '';
  if (ac.dataset.acao === 'convidar') texto = `Entra na Copa Botânica do Marista Asa Sul! Sala ${SALA} 🌱⚔️`;
  if (ac.dataset.acao === 'resultado') {
    const eu = ESTADO.j[EU.id], s = estagio(eu.e);
    texto = ESTADO.campeao === EU.id
      ? `🏆 Fui CAMPEÃO da Copa Botânica Marista Asa Sul 2026! ${eu.p} 🌼 de pólen. Duvido você me vencer em botânica 🌵`
      : `Cheguei a ${s.e} ${s.nome} na Copa Botânica Marista Asa Sul 2026 com ${eu.p} 🌼 de pólen. Duvido chegar mais longe 🌵`;
  }
  try { if (navigator.share) { await navigator.share({ title: 'Copa Botânica Marista Asa Sul 2026', text: texto, url: link }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(`${texto} ${link}`); ac.textContent = '🌿 Copiado! Cola no grupo da turma'; } catch (e) {}
});
setInterval(() => { const f = document.getElementById('fato'); if (f) f.textContent = FATOS[Math.floor(Date.now() / 8000) % FATOS.length]; }, 1000);

document.getElementById('polen').innerHTML = Array.from({length: 14}, (_, i) => `<i style="left:${(i*37)%100}%;animation-duration:${9+(i%5)*3}s;animation-delay:${-(i*1.7)}s;width:${4+(i%3)*2}px;height:${4+(i%3)*2}px"></i>`).join('');

// ---------- início ----------
(async function () {
  if (!SALA) { telaCodigo(); return; }
  EU = lerEu();
  try {
    const t0 = Date.now();
    const d = await rpc('ver_jogo', { p_codigo: SALA, p_token: EU ? EU.token : null });
    ajustarRelogio(d.agora, t0); ESTADO = d.estado;
    if (EU && !d.eu) { salvarEu(null); EU = null; }
  } catch (e) { telaCodigo(e.message); return; }
  if (!EU) telaNome(); else iniciar();
})();
</script>
